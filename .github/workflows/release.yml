name: Build and Release

on:
  push:

permissions:
  contents: write

jobs:

  linux:
    name: Linux
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build
        env:
          VERSION_SEMVER: ${{ github.ref_name }}
        run: bash buildEclipse.sh

      - name: Upload Linux build
        uses: actions/upload-artifact@v7
        with:
          name: linux-lib
          path: release/*
          if-no-files-found: error


  windows:
    name: Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Build
        shell: bash
        env:
          VERSION_SEMVER: ${{ github.ref_name }}
        run: bash buildEclipse.sh

      - name: Upload Windows build
        uses: actions/upload-artifact@v7
        with:
          name: win-lib
          path: release/*
          if-no-files-found: error


  macos-arm:
    name: macOS ARM64
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build
        env:
          VERSION_SEMVER: ${{ github.ref_name }}
        run: bash buildEclipse.sh

      - name: Upload macOS ARM64 build
        uses: actions/upload-artifact@v7
        with:
          name: mac-lib-arm
          path: release/*
          if-no-files-found: error




  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest

    needs:
      - linux
      - windows
      - macos-arm

    # This job runs ONLY when the push was a tag.
    if: ${{ github.ref_type == 'tag' }}

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download Linux build
        uses: actions/download-artifact@v7
        with:
          name: linux-lib
          path: release

      - name: Download Windows build
        uses: actions/download-artifact@v7
        with:
          name: win-lib
          path: release

      - name: Download macOS ARM64 build
        uses: actions/download-artifact@v7
        with:
          name: mac-lib-arm
          path: release

      - name: Check release files
        run: |
          echo "Release tag: ${{ github.ref_name }}"
          echo
          echo "Release files:"
          find release -maxdepth 1 -type f -printf '%f\n'

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            release/*